<style>
    .body{
        margin: auto;
    }
    .input_field {
      width: 100%;
      padding: 12px 20px;
      margin: 8px 0;
      display: inline-block;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    .input_submit {
      width: 100%;
      background-color: #4CAF50;
      color: white;
      padding: 14px 20px;
      margin: 8px 0;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .input_submit:hover {
      background-color: #45a049;
    }
</style>

{% extends "base.html" %}
{% block body %}
    <div class="body">
        {% if error %}
            <h2>{{ error }}</h2>
        {% endif %}

        {% if success %}
            <h2>{{ success }}</h2>
        {% endif %}

        <form action="/delete" method="POST">

{% extends "base.html" %}
{% block body %}
<div class="mainDiv" style="margin-top: 30px;">
  <h2>Delete a Boat</h2>
  <form method="POST">
    <input type="text" name="id" placeholder="Enter Boat ID" required class="input">
    <input type="submit" value="Delete" class="input" style="margin-top: 10px; background-color: #af8382; color: white;">
  </form>

  {% if message %}
    <p style="margin-top: 20px; color: #664242;">{{ message }}</p>
  {% endif %}
</div>

{% endblock %}
