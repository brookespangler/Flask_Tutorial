{% extends "base.html" %}
{% block body %}
<div class="mainDiv" style="margin-top: 30px;">
  <h2>Delete a Boat</h2>
  <form method="POST">
    <input type="text" name="id" placeholder="Enter Boat ID" required class="input">
    <input type="submit" value="Delete" class="input" style="margin-top: 10px; background-color: #af8382; color: white;">
  </form>

  {% if message %}
    <p style="margin-top: 20px; color: #664242;">{{ message }}</p>
  {% endif %}
</div>
{% endblock %}
