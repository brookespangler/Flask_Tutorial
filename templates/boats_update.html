{% extends "base.html" %}
{% block body %}
<div class="mainDiv" style="margin-top: 30px;">
  <h2>Update a Boat</h2>

  <form method="POST">
    <input type="text" name="id" placeholder="Boat ID (can't be changed)" required class="input"><br><br>
    <input type="text" name="name" placeholder="New Name" class="input"><br><br>
    <input type="text" name="type" placeholder="New Type" class="input"><br><br>
    <input type="number" name="owner_id" placeholder="New Owner ID" class="input"><br><br>
    <input type="number" step="0.01" name="rental_price" placeholder="New Rental Price" class="input"><br><br>

    <input type="submit" value="Update Boat" class="input" style="background-color: #af8382; color: white;">
  </form>

  {% if message %}
    <p style="color: green;">{{ message }}</p>
  {% endif %}
  {% if error %}
    <p style="color: red;">{{ error }}</p>
  {% endif %}
</div>
{% endblock %}
