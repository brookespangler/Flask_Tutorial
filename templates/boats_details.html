{% extends "base.html" %}
{% block body %}
<div class="mainDiv" style="margin-top: 30px;">
  <h2>Boat Details</h2>
  <div class="boat" style="padding: 20px; border-radius: 10px; background-color: #d0bcb1; color: #664242;">
    <img src="{{ url_for('static', filename='images/woodenboat.png') }}" alt="Boat Image" style="width: 100%; border-radius: 10px;">
    <ul style="padding: 10px;">
      <li><strong>ID:</strong> {{ boat.id }}</li>
      <li><strong>Name:</strong> {{ boat.name }}</li>
      <li><strong>Type:</strong> {{ boat.type }}</li>
      <li><strong>Owner ID:</strong> {{ boat.owner_id }}</li>
      <li><strong>Price:</strong> ${{ boat.rental_price }}</li>
    </ul>
  </div>
  <div style="margin-top: 20px;">
    <a href="/boats/{{ page }}">← Back to All Boats</a>
  </div>
</div>
{% endblock %}
